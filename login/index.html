<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン / 新規登録 - Voton caxt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
                Voton caxt
            </h1>
            <p class="text-slate-400 text-sm mt-1">リアルタイム・テキスト通話プラットフォーム</p>
        </div>

        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all">ログイン</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent transition-all">新規登録</button>
        </div>

        <form id="form-login" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">メールアドレス</label>
                <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">パスワード</label>
                <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 font-bold py-3 rounded-lg shadow-lg hover:opacity-90 transition-all">
                ログインする
            </button>
        </form>

        <form id="form-register" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">メールアドレス</label>
                <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">パスワード</label>
                <input type="password" id="reg-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">表示名（ニックネーム）</label>
                <input type="text" id="reg-displayname" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ユーザー名（固有ID / 半角英数字）</label>
                <input type="text" id="reg-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">誕生日</label>
                <input type="date" id="reg-birthday" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">プロフィール画像（アイコン）</label>
                <input type="file" id="reg-avatar" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-cyan-400 hover:file:bg-slate-600">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 font-bold py-3 rounded-lg shadow-lg hover:opacity-90 transition-all">
                アカウントを作成
            </button>
        </form>
    </div>

    <script type="module">
        // Firebaseのインポート（モジュール版）
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setTimestamp, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: あなたのFirebase設定情報に書き換えてください
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // タブ切り替え関数
        window.switchTab = function(mode) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');

            if (mode === 'login') {
                loginTab.className = "flex-1 pb-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all";
                regTab.className = "flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent transition-all";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regTab.className = "flex-1 pb-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all";
                loginTab.className = "flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent transition-all";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        // ログイン処理
        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                alert("ログイン成功！ようこそ " + userCredential.user.email);
                // ここでチャット画面等へ遷移
            } catch (error) {
                alert("ログインエラー: " + error.message);
            }
        }

        // 新規登録処理（画像Base64変換対応）
        window.handleRegister = async function(event) {
            event.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const displayName = document.getElementById('reg-displayname').value;
            const username = document.getElementById('reg-username').value;
            const birthday = document.getElementById('reg-birthday').value;
            const avatarFile = document.getElementById('reg-avatar').files[0];

            let photoBase64 = "";

            // 画像が選択されている場合、Base64文字列に変換
            if (avatarFile) {
                photoBase64 = await toBase64(avatarFile);
            }

            try {
                // 1. Authenticationでユーザー作成
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // 2. Firestoreにユーザー詳細データを保存
                await setDoc(doc(db, "users", uid), {
                    uid: uid,
                    email: email,
                    displayName: displayName,
                    username: username,
                    birthday: birthday,
                    photoURL: photoBase64,
                    isAdmin: false, // デフォルトは一般ユーザー
                    createdAt: new Date()
                });

                alert("アカウント作成成功！");
            } catch (error) {
                alert("登録エラー: " + error.message);
            }
        }

        // ファイルをBase64に変換するヘルパー関数
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
