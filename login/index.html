<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン & アカウント作成 — Voton caxt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-focus {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-focus:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        /* スムーズなタブ切り替えアニメーション */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-white relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md relative z-10">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 shadow-lg shadow-cyan-500/20 mb-4 text-white font-extrabold text-xl tracking-tighter">
                V
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Voton caxt</h1>
            <p class="text-slate-400 text-xs mt-1.5 font-medium">リアルタイム・テキスト通話プラットフォーム</p>
        </div>

        <div class="grid grid-cols-2 p-1 bg-slate-900/80 rounded-xl mb-6 border border-slate-800">
            <button id="btn-login-tab" onclick="switchTab('login')" class="py-2.5 text-xs font-bold rounded-lg text-cyan-400 bg-slate-800 shadow-sm transition-all">ログイン</button>
            <button id="btn-register-tab" onclick="switchTab('register')" class="py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition-all">新規登録</button>
        </div>

        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

        <div id="tab-login" class="tab-content active">
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">メールアドレス</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" 
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 input-focus outline-none">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">パスワード</label>
                        <a href="#" class="text-[11px] text-cyan-400 hover:underline">パスワードをお忘れですか？</a>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 input-focus outline-none">
                </div>
                <button type="submit" id="login-submit-btn" class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-cyan-500/25 transition-all active:scale-[0.99] text-sm flex items-center justify-center space-x-2">
                    <span>サインイン</span>
                </button>
            </form>
        </div>

        <div id="tab-register" class="tab-content">
            <form onsubmit="handleRegister(event)" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">メールアドレス</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com" 
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 input-focus outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">パスワード (6文字以上)</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" 
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 input-focus outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">表示名</label>
                        <input type="text" id="reg-displayname" required placeholder="山田 太郎" 
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 input-focus outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">ユーザー名</label>
                        <input type="text" id="reg-username" required placeholder="yamada_t" 
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 input-focus outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">誕生日</label>
                    <input type="date" id="reg-birthday" required 
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white input-focus outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">プロフィール画像</label>
                    <input type="file" id="reg-avatar" accept="image/*" 
                        class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer">
                </div>
                <button type="submit" id="reg-submit-btn" class="w-full mt-1 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-cyan-500/25 transition-all active:scale-[0.99] text-sm flex items-center justify-center space-x-2">
                    <span>アカウントを作成</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center border-t border-slate-800/80 pt-4">
            <p class="text-[11px] text-slate-500">Secure Authentication Powered by Firebase</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // あなたの設定情報
        const firebaseConfig = {
            apiKey: "AIzaSyBleGBlEcKLXIpbG3QX5U-PKn5r6LyelrM",
            authDomain: "caxt-voton.firebaseapp.com",
            projectId: "caxt-voton",
            storageBucket: "caxt-voton.firebasestorage.app",
            messagingSenderId: "1084952757805",
            appId: "1:1084952757805:web:f2a826696c73e229a11aa4",
            measurementId: "G-SVBR120FLK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // タブ切り替えのUIロジック
        window.switchTab = function(mode) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const btnLogin = document.getElementById('btn-login-tab');
            const btnReg = document.getElementById('btn-register-tab');
            hideAlert();

            if (mode === 'login') {
                loginTab.classList.add('active');
                regTab.classList.remove('active');
                btnLogin.className = "py-2.5 text-xs font-bold rounded-lg text-cyan-400 bg-slate-800 shadow-sm transition-all";
                btnReg.className = "py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition-all";
            } else {
                regTab.classList.add('active');
                loginTab.classList.remove('active');
                btnReg.className = "py-2.5 text-xs font-bold rounded-lg text-cyan-400 bg-slate-800 shadow-sm transition-all";
                btnLogin.className = "py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition-all";
            }
        };

        // アラート表示ヘルパー
        function showAlert(message, isError = true) {
            const box = document.getElementById('alert-box');
            box.className = `mb-4 p-3 rounded-xl text-xs font-medium border ${isError ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`;
            box.textContent = message;
            box.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        // ログイン処理
        window.handleLogin = async function(event) {
            event.preventDefault();
            hideAlert();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit-btn');

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ログイン中...`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showAlert("ログインに成功しました。リダイレクト中...", false);
                setTimeout(() => {
                    // ログイン成功後の遷移先（チャット画面等）
                    window.location.href = "../chat/index.html"; 
                }, 1000);
            } catch (error) {
                showAlert("エラー: メールアドレスまたはパスワードが正しくありません。");
                btn.disabled = false;
                btn.innerHTML = `<span>サインイン</span>`;
            }
        };

        // 新規登録処理（Base64変換対応）
        window.handleRegister = async function(event) {
            event.preventDefault();
            hideAlert();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const displayName = document.getElementById('reg-displayname').value;
            const username = document.getElementById('reg-username').value;
            const birthday = document.getElementById('reg-birthday').value;
            const avatarFile = document.getElementById('reg-avatar').files[0];
            const btn = document.getElementById('reg-submit-btn');

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> アカウント作成中...`;

            try {
                let photoBase64 = "";
                if (avatarFile) {
                    photoBase64 = await toBase64(avatarFile);
                }

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                await setDoc(doc(db, "users", uid), {
                    uid: uid,
                    email: email,
                    displayName: displayName,
                    username: username,
                    birthday: birthday,
                    photoURL: photoBase64,
                    isAdmin: false,
                    createdAt: new Date()
                });

                showAlert("アカウント作成が完了しました！移動中...", false);
                setTimeout(() => {
                    window.location.href = "../chat/index.html";
                }, 1000);
            } catch (error) {
                showAlert("登録エラー: " + error.message);
                btn.disabled = false;
                btn.innerHTML = `<span>アカウントを作成</span>`;
            }
        };

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
